<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elyza Digital Lab | GitHub API</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f8f8;
            color: #000000;
        }

        /* Header */
        header {
            background-color: #7B1113;
        }

        header h1 {
            font-weight: 700;
        }

        /* Navigation */
        .navbar {
            background-color: #000000 !important;
        }

        .navbar-brand {
            color: white !important;
            font-weight: 600;
        }

        .navbar-brand:hover {
            color: #7B1113 !important;
        }

        .nav-link {
            color: white !important;
            transition: 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #7B1113 !important;
        }

        /* Main Card */
        .card {
            border: none;
            border-top: 5px solid #7B1113;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .card h2 {
            color: #7B1113;
            font-weight: 600;
        }

        /* Input */
        .form-control {
            border: 2px solid #ddd;
            padding: 12px;
            font-family: 'Poppins', sans-serif;
        }

        .form-control:focus {
            border-color: #7B1113;
            box-shadow: 0 0 0 0.2rem rgba(123, 17, 19, 0.15);
        }

        /* Button */
        .btn-dark {
            background-color: #7B1113;
            border-color: #7B1113;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }

        .btn-dark:hover {
            background-color: #000000;
            border-color: #000000;
            transform: translateY(-2px);
        }

        /* GitHub Result */
        #userResult {
            padding: 20px;
        }

        #userResult h3 {
            color: #7B1113;
            font-weight: 600;
        }

        #userResult img {
            border: 4px solid #7B1113;
        }

        #userResult p {
            margin-bottom: 8px;
        }

        /* Footer */
        footer {
            background-color: #000000 !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar-nav {
                text-align: center;
            }

            .card {
                margin: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="text-white text-center p-4">
        <h1>Elyza Digital Lab</h1>
        <p class="mb-0">Week 6 • Client-Side Storage & API Integration</p>
    </header>


    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Elyza Digital Lab
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="local_storage.html">
                            Local Storage
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="user_preferences.html">
                            User Preferences
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="weather_api.html">
                            Weather
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="map_api.html">
                            Maps
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="github_api.html">
                            GitHub
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-4">
                        🐙 GitHub User Lookup
                    </h2>

                    <div class="input-group mb-3">

                        <input type="text"
                               id="username"
                               class="form-control"
                               placeholder="Enter GitHub Username">

                        <button class="btn btn-dark"
                                onclick="getUser()">
                            Get User
                        </button>

                    </div>


                    <!-- GitHub User Result -->
                    <div id="userResult"
                         class="text-center mt-4">
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="text-white text-center p-3">
        <p class="mb-0">Elyza Digital Lab | Web Systems Portfolio</p>
    </footer>


    <!-- GitHub API JavaScript -->
    <script>

        function getUser() {

            let username =
                document.getElementById("username").value;

            let url =
                `https://api.github.com/users/${username}`;

            fetch(url)

                .then(response => response.json())

                .then(data => {

                    document.getElementById("userResult").innerHTML = `

                        <h3>${data.name || "No Name Found"}</h3>

                        <img
                            src="${data.avatar_url}"
                            width="100"
                            height="100"
                            class="rounded-circle mb-3"
                            alt="GitHub Avatar"
                        >

                        <p>
                            <strong>Public Repositories:</strong>
                            ${data.public_repos}
                        </p>

                        <p>
                            <strong>Followers:</strong>
                            ${data.followers}
                        </p>

                    `;

                })

                .catch(error => {

                    document.getElementById("userResult").innerHTML =
                        "<p class='text-danger'>Error fetching GitHub data.</p>";

                    console.error(
                        "Error fetching GitHub data:",
                        error
                    );

                });

        }

    </script>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
