<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elyza Digital Lab | User Preferences</title>

    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f8f8;
            color: #000000;
            margin: 0;
        }

        /* Header */
        .site-header {
            background-color: #7B1113;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .site-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .site-header p {
            margin: 5px 0 0;
            font-size: 14px;
        }

        /* Navigation */
        .navbar {
            background-color: #000000 !important;
        }

        .navbar-brand {
            color: white !important;
            font-weight: 600;
        }

        .navbar .nav-link {
            color: white !important;
            transition: 0.3s;
        }

        .navbar .nav-link:hover {
            color: #7B1113 !important;
        }

        /* Main container */
        .main-container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
        }

        /* Card */
        .card {
            border: 2px solid #7B1113;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .card-body {
            padding: 35px;
        }

        .card-title {
            color: #7B1113;
            font-weight: 700;
            margin-bottom: 30px;
        }

        /* Form */
        .form-label {
            font-weight: 600;
        }

        .form-control {
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #7B1113;
            box-shadow: 0 0 0 0.2rem rgba(123, 17, 19, 0.15);
        }

        /* Buttons */
        .btn-save {
            background-color: #7B1113;
            color: white;
            border: 2px solid #7B1113;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-save:hover {
            background-color: #000000;
            border-color: #000000;
            color: white;
            transform: translateY(-2px);
        }

        .btn-load {
            background-color: #000000;
            color: white;
            border: 2px solid #000000;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-load:hover {
            background-color: #7B1113;
            border-color: #7B1113;
            color: white;
            transform: translateY(-2px);
        }

        /* Display message */
        #display {
            background-color: #f1f1f1;
            border-left: 5px solid #7B1113;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
            min-height: 50px;
        }

        /* Footer */
        .site-footer {
            background-color: #000000;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .card-body {
                padding: 25px 20px;
            }

            .site-header h1 {
                font-size: 23px;
            }

            .btn-save,
            .btn-load {
                width: 100%;
                margin: 5px 0 !important;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <h1>Elyza Digital Lab</h1>
        <p>Learn • Design • Develop</p>
    </header>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Elyza Digital Lab
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="local_storage.html">
                            Local Storage
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="user_preferences.html">
                            User Preferences
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="weather_api.html">
                            Weather
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="map_api.html">
                            Maps
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="github_api.html">
                            GitHub
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-container">

        <div class="card">

            <div class="card-body">

                <h2 class="card-title text-center">
                    Save User Preferences
                </h2>

                <div class="mb-4">

                    <label for="username" class="form-label">
                        Enter Name:
                    </label>

                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Enter your name">

                </div>

                <div class="text-center">

                    <button
                        onclick="saveData()"
                        class="btn-save me-2">
                        Save
                    </button>

                    <button
                        onclick="loadData()"
                        class="btn-load">
                        Load
                    </button>

                </div>

                <p id="display" class="text-center mt-4">
                </p>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        Elyza Digital Lab | Web Systems Portfolio
    </footer>

    <!-- JavaScript -->
    <script>

        function saveData() {

            let name = document.getElementById("username").value;

            localStorage.setItem("userName", name);

            alert("Data Saved!");
        }

        function loadData() {

            let name = localStorage.getItem("userName");

            document.getElementById("display").innerText =
                name
                ? "Welcome, " + name
                : "No data saved!";
        }

    </script>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
