<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elyza Digital Lab | Weather API</title>

    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f8f8;
            color: #000000;
        }

        /* Header */
        .site-header {
            background-color: #7B1113;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .site-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .site-header p {
            margin: 0;
            font-size: 14px;
        }

        /* Navigation */
        .navbar {
            background-color: #000000 !important;
        }

        .navbar-brand {
            color: white !important;
            font-weight: 600;
        }

        .navbar .nav-link {
            color: white !important;
            transition: 0.3s;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: #7B1113 !important;
        }

        /* Main Card */
        .weather-card {
            border: 2px solid #7B1113;
            border-radius: 15px;
            padding: 30px;
            transition: 0.3s;
        }

        .weather-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15) !important;
        }

        .weather-card h2 {
            color: #7B1113;
            font-weight: 700;
        }

        /* Input */
        .form-control {
            border: 2px solid #ccc;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #7B1113;
            box-shadow: 0 0 0 0.2rem rgba(123, 17, 19, 0.15);
        }

        /* Weather Button */
        .btn-weather {
            background-color: #7B1113;
            color: white;
            border: 2px solid #7B1113;
            font-weight: 600;
            padding: 10px 20px;
            transition: 0.3s;
        }

        .btn-weather:hover {
            background-color: #000000;
            border-color: #000000;
            color: white;
            transform: translateY(-2px);
        }

        /* Weather Result */
        #weatherResult {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background-color: #f1f1f1;
            border-left: 5px solid #7B1113;
        }

        #weatherResult h3 {
            color: #7B1113;
            font-weight: 700;
        }

        #weatherResult h4 {
            font-size: 28px;
            font-weight: 700;
        }

        #weatherResult img {
            width: 80px;
            height: 80px;
        }

        /* Footer */
        .site-footer {
            background-color: #000000;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        .site-footer p {
            margin: 0;
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 576px) {

            .site-header h1 {
                font-size: 23px;
            }

            .weather-card {
                padding: 20px;
            }

            .input-group {
                display: block;
            }

            .input-group .form-control {
                width: 100%;
                margin-bottom: 10px;
            }

            .btn-weather {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <h1>Elyza Digital Lab</h1>
        <p>Learn • Design • Develop</p>
    </header>


    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Elyza Digital Lab
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="local_storage.html">
                            Local Storage
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="user_preferences.html">
                            User Preferences
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="weather_api.html">
                            Weather
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="map_api.html">
                            Maps
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="github_api.html">
                            GitHub
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow weather-card">

                    <h2 class="text-center mb-4">
                        🌤️ Weather Checker
                    </h2>

                    <div class="input-group mb-3">

                        <input
                            type="text"
                            id="city"
                            class="form-control"
                            placeholder="Enter city name">

                        <button
                            class="btn btn-weather"
                            onclick="getWeather()">

                            Get Weather

                        </button>

                    </div>


                    <!-- Weather Result -->
                    <div id="weatherResult"
                         class="text-center">

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="site-footer">
        <p>Elyza Digital Lab | Web Systems Portfolio</p>
    </footer>


    <!-- Weather API JavaScript -->
    <script>

        function getWeather() {

            let city =
                document.getElementById("city").value.trim();

            if (city === "") {

                document.getElementById("weatherResult").innerHTML =
                    "<p class='text-danger'>Please enter a city name.</p>";

                return;
            }


            /*
             * Keep your existing OpenWeather API key here.
             * Do not share the key publicly.
             */

            let apiKey = "7b2d4932331ab5dee52391075d5e0450";

            let url =
                `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;


            document.getElementById("weatherResult").innerHTML =
                "<p>Loading weather data...</p>";


            fetch(url)

                .then(response => {

                    if (!response.ok) {
                        throw new Error("City not found");
                    }

                    return response.json();

                })

                .then(data => {

                    document.getElementById("weatherResult").innerHTML = `

                        <h3>${data.name}</h3>

                        <img
                            src="https://openweathermap.org/img/w/${data.weather[0].icon}.png"
                            alt="Weather icon">

                        <h4>${data.main.temp}°C</h4>

                        <p class="text-capitalize">
                            ${data.weather[0].description}
                        </p>

                    `;

                })

                .catch(error => {

                    document.getElementById("weatherResult").innerHTML =
                        "<p class='text-danger'>Unable to fetch weather data. Please check the city name or API key.</p>";

                    console.error(
                        "Error fetching weather data:",
                        error
                    );

                });

        }

    </script>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
