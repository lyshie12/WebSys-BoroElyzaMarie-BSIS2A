<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elyza Digital Lab | User Preferences</title>

    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f8f8;
            color: #000000;
            transition: 0.3s;
        }

        /* Header */
        .site-header {
            background-color: #7B1113;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .site-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .site-header p {
            margin: 0;
            font-size: 14px;
        }

        /* Navigation */
        .navbar {
            background-color: #000000 !important;
        }

        .navbar-brand {
            color: white !important;
            font-weight: 600;
        }

        .navbar .nav-link {
            color: white !important;
            transition: 0.3s;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: #7B1113 !important;
        }

        /* Main Card */
        .preference-card {
            border: 2px solid #7B1113;
            border-radius: 15px;
            padding: 30px;
            transition: 0.3s;
        }

        .preference-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15) !important;
        }

        .preference-card h2 {
            color: #7B1113;
            font-weight: 700;
        }

        /* Form */
        .form-label {
            font-weight: 600;
        }

        .form-select {
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 10px;
        }

        .form-select:focus {
            border-color: #7B1113;
            box-shadow: 0 0 0 0.2rem rgba(123, 17, 19, 0.15);
        }

        /* Save Button */
        .btn-save {
            background-color: #7B1113;
            border: 2px solid #7B1113;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-save:hover {
            background-color: #000000;
            border-color: #000000;
            color: white;
            transform: translateY(-2px);
        }

        /* Message */
        #message {
            color: #7B1113;
            font-weight: 600;
        }

        /* Footer */
        .site-footer {
            background-color: #000000;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        .site-footer p {
            margin: 0;
            font-size: 14px;
        }

        /* Dark Mode - Functionality Preserved */
        body.dark-mode {
            background-color: #212529;
            color: white;
        }

        body.dark-mode .preference-card {
            background-color: #343a40;
            color: white;
            border-color: #7B1113;
        }

        body.dark-mode .preference-card h2 {
            color: #ffffff;
        }

        body.dark-mode .form-select {
            background-color: #212529;
            color: white;
            border-color: #7B1113;
        }

        body.dark-mode .form-label {
            color: white;
        }

        body.dark-mode #message {
            color: #ffffff;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .site-header h1 {
                font-size: 23px;
            }

            .preference-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <h1>Elyza Digital Lab</h1>
        <p>Learn • Design • Develop</p>
    </header>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Elyza Digital Lab
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="local_storage.html">
                            Local Storage
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="user_preferences.html">
                            User Preferences
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="weather_api.html">
                            Weather
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="map_api.html">
                            Maps
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="github_api.html">
                            GitHub
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow preference-card">

                    <h2 class="text-center mb-4">
                        Choose Your Preferences
                    </h2>

                    <!-- Theme -->
                    <div class="mb-3">

                        <label for="theme" class="form-label">
                            Theme:
                        </label>

                        <select id="theme" class="form-select">

                            <option value="light">
                                Light Mode
                            </option>

                            <option value="dark">
                                Dark Mode
                            </option>

                        </select>

                    </div>

                    <!-- Language -->
                    <div class="mb-4">

                        <label for="language" class="form-label">
                            Language:
                        </label>

                        <select id="language" class="form-select">

                            <option value="en">
                                English
                            </option>

                            <option value="es">
                                Spanish
                            </option>

                        </select>

                    </div>

                    <!-- Save Button -->
                    <button
                        class="btn btn-save w-100"
                        onclick="savePreferences()">

                        Save Preferences

                    </button>

                    <p id="message" class="text-center mt-3"></p>

                </div>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>Elyza Digital Lab | Web Systems Portfolio</p>
    </footer>

    <!-- JavaScript -->
    <script>

        function savePreferences() {

            let theme =
                document.getElementById("theme").value;

            let language =
                document.getElementById("language").value;

            localStorage.setItem("theme", theme);

            localStorage.setItem("language", language);

            applyPreferences();

            document.getElementById("message").innerText =
                "Preferences Saved!";
        }


        function applyPreferences() {

            let savedTheme =
                localStorage.getItem("theme");

            let savedLanguage =
                localStorage.getItem("language");


            if (savedTheme === "dark") {

                document.body.classList.add("dark-mode");

            } else {

                document.body.classList.remove("dark-mode");

            }


            document.getElementById("theme").value =
                savedTheme || "light";

            document.getElementById("language").value =
                savedLanguage || "en";
        }


        // Apply saved preferences when page loads
        applyPreferences();

    </script>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
